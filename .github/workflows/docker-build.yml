name: Build and Push Docker Image
on:
  push:
    branches:
      - main
      - ps-9.2

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # main publishes latest/main (the 9.1.x images every current store uses); ps-9.2 publishes only its own
      # version tag (9.2.0), never latest: nothing that runs today changes.
      - name: Build and push Docker image (main)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/aipresta/prestashop-ssl-ready:latest
            ghcr.io/aipresta/prestashop-ssl-ready:main
            ghcr.io/aipresta/prestashop-ssl-ready:${{ github.sha }}

      - name: Build and push Docker image (ps-9.2)
        if: github.ref == 'refs/heads/ps-9.2'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/aipresta/prestashop-ssl-ready:9.2.0
            ghcr.io/aipresta/prestashop-ssl-ready:${{ github.sha }}
